[package]
name = "g4v"
version = "0.3.3"
edition = "2021"
description = "A friendly, P4V-style visual client for Git with changelists, shelves, LFS locks and out-of-date indicators."
license = "MIT"
repository = "https://github.com/ClayMStamper/g4v"
default-run = "g4v"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tga", "tiff", "webp"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
